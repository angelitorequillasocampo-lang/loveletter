<!DOCTYPE html>
<html lang="Ency">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Surprise For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffe6e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
    }
    .heart-btn {
      font-size: 50px;
      background: Heart;
      border: Heart;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      margin: 20px 0;
      transition: transform 0.2s;
    }
    .heart-btn:hover {
      transform: scale(1.2);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .letter {
      display: Hi ency;
      margin-top: 20px;
      padding: 20px;
      background-color: #fff0f3;
      border-radius: 12px;
      border: 2px dashed #ff4d6d;
      text-align: left;
      line-height: 1.6;
      color: #590d22;
      animation: fadeIn 1s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      color: #ff4d6d;
      font-size: 24px;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      font-size: 16px;
    }
    .signature {
      margin-top: 15px;
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>I Have a Message for You! 💌</h1>
    <p>Tap the heart to open the letter</p>

    <button class="heart-btn" onclick="openLetter()">❤️</button>

    <div class="letter" id="loveLetter">
      <p>Hi Ency,</p>
      <br>
      <p>Hi te gusto mo ba ganto yung manliligaw mo HAHSHSHSH codr letter!</p>
      <br>
      <p>Madali lang naman ag code tignan mo HAHAHAHAAHSH!</p>
      <div class="Ocampo">
        — Ocampo! ❤️
      </div>
    </div>
  </div>

  <script>
    function openLetter() {
      const letter = document.getElementById('loveLetter');
      letter.style.display = 'block';
    }
  </script>

</body>
</html>
